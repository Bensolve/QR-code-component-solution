<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./images/favicon-32x32.png" />
    <link rel="stylesheet" href="/style.css" />
    <title>QR Code Generator</title>
  </head>

  <body>
    <main class="qr-card">
      <section class="qr-card__container">
        <h1 class="qr-card__title">QR Code Generator</h1>
        <p class="qr-card__description">
          Enter a URL or any text below to generate a QR code.
        </p>

        <form class="qr-card__form" id="qr-form">
          <input
            type="text"
            id="qr-input"
            class="qr-card__input"
            placeholder="Enter URL or text"
            required
          />
          <button type="submit" id="generate-btn" class="qr-card__button">
            Generate QR Code
          </button>
        </form>

        <div id="qrcode" class="qr-card__output"></div>
        <button id="download-btn" class="qr-card__button" style="display:none;">
          Download QR Code
        </button>
      </section>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="/script.js"></script>
  </body>
</html>
